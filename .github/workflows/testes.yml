name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck e build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Servidor - dependências, Prisma e typecheck
        working-directory: server
        run: |
          npm ci || npm install
          npx prisma generate
          npx tsc --noEmit
      - name: Cliente - dependências, typecheck e build
        working-directory: client
        run: |
          npm ci || npm install
          npx tsc --noEmit
          npm run build

